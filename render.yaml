services:
  # Private TCP auth — reachable only from other Render services in the same region
  - type: pserv
    name: trempist-auth
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: sh services/auth-server/start.sh
    envVars:
      - key: AUTH_SOCKET_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_EXPIRE_HOURS
        value: "24"
      - key: AUTH_PEPPER
        sync: false

  # Public HTTPS API — proxies auth to trempist-auth over TCP
  - type: web
    name: trempist-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_EXPIRE_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: "*"
      - key: AUTH_SOCKET_HOST
        value: trempist-auth
      - key: AUTH_SOCKET_PORT
        value: "10000"
