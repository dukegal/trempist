services:
  - type: web
    name: trempist-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_EXPIRE_HOURS
        value: "24"
      - key: CORS_ORIGINS
        value: "*"
