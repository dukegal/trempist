<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="12%" y1="8%" x2="92%" y2="92%">
      <stop offset="0%" stop-color="#3ae8ff"/>
      <stop offset="45%" stop-color="#00a8e6"/>
      <stop offset="100%" stop-color="#6e52ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4f4ff"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="22" fill="url(#lg)"/>
  <!-- road -->
  <path fill="rgba(13,33,55,0.2)" d="M6 62h68v8H6z"/>
  <path fill="rgba(255,255,255,0.45)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" stroke-dasharray="5 6" d="M10 66h60"/>
  <!-- car shadow -->
  <ellipse cx="42" cy="54" rx="26" ry="5" fill="rgba(13,33,55,0.28)"/>
  <!-- lower body -->
  <path filter="url(#sh)" fill="url(#body)" d="M14 44c0-4 3.5-7 8-7h36c4.5 0 8 3 8 7v6H14v-6z"/>
  <!-- upper cabin -->
  <path fill="url(#body)" d="M22 28c2.5-8 9-12 18-12s15.5 4 18 12v12H22V28z"/>
  <!-- windows -->
  <path fill="#1a6a8a" fill-opacity="0.45" d="M26 30h12v9H26zm16 0h12v9H42z"/>
  <!-- door line -->
  <path stroke="rgba(13,33,55,0.15)" stroke-width="1.2" d="M40 28v16"/>
  <!-- wheels -->
  <circle cx="24" cy="48" r="7" fill="#0d2137"/>
  <circle cx="56" cy="48" r="7" fill="#0d2137"/>
  <circle cx="24" cy="48" r="3" fill="#94a3b8"/>
  <circle cx="56" cy="48" r="3" fill="#94a3b8"/>
  <!-- bumper + light -->
  <rect x="64" y="40" width="4" height="6" rx="1" fill="#ffe566"/>
  <path fill="rgba(13,33,55,0.12)" d="M14 48h6v4h-6z"/>
</svg>
